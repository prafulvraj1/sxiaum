[workspace]
resolver = "2"

members = [
    "bin/node",
    "bin/cli",
    "bin/genesis",
    "bin/srs",
    "crates/*",
    "crates/keytool",
]

exclude = [
    "crates/zk/guest",
    "fuzz",
]

# Vendored sp1-core-machine 3.4.0 with explicit type annotations required by
# rustc >= 1.89 (trait-solver change in rust-lang/rust#137268). The patch is
# annotation-only (no semantic changes); see SXIAUM PATCH comments inside.
[patch.crates-io]
sp1-core-machine = { path = "vendor/sp1-core-machine" }

[workspace.dependencies]
# Standard dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.4", features = ["derive"] }
async-trait = "0.1"
futures = "0.3"
rand = "0.8"
zeroize = { version = "1.8", features = ["zeroize_derive"] }
hex = "0.4"
indexmap = { version = "2.2", features = ["serde"] }
primitive-types = { version = "0.12", features = ["serde"] }
derive_more = "0.99"
chrono = { version = "0.4", features = ["serde"] }
# SECURITY: >= 0.14 fixes RUSTSEC-2026-0002 / RUSTSEC-2026-0253 soundness issues.
lru = "0.18"
metrics = "0.22"
parking_lot = "0.12"
criterion = "0.5"

# Cryptography
# SECURITY: arkworks 0.6 drops unmaintained `paste` (ark-ff) and the
# vulnerable tracing-subscriber 0.2 chain (ark-relations). NOTE: Groth16
# proving/verifying keys serialized with 0.4 are NOT compatible; regenerate.
sha3 = "0.10"
sha2 = "0.10"
bincode = "1.3"
rlp = "0.5"
ed25519-dalek = "2.1"
secp256k1 = { version = "0.27", features = ["recovery"] }
ark-bls12-381 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-serialize = "0.6"
ark-groth16 = "0.6"
ark-relations = "0.6"
ark-r1cs-std = "0.6"
ark-mnt4-753 = { version = "0.6", default-features = false, features = ["std", "curve"] }
ark-mnt6-753 = { version = "0.6", default-features = false, features = ["std"] }
ark-snark = "0.6"
ark-crypto-primitives = { version = "0.6", default-features = false, features = ["std", "crh", "constraints"] }
ark-std = { version = "0.6", default-features = false }

# Networking
# SECURITY: keep >= 0.55 so the TLS stack uses maintained rustls/ring 0.17
# (libp2p-tls on 0.53 pulls unmaintained ring 0.16 — RUSTSEC-2025-0009/0010).
libp2p = { version = "0.56", default-features = false, features = ["tcp", "dns", "websocket", "noise", "tls", "yamux", "gossipsub", "mdns", "kad", "identify", "ping", "request-response", "macros", "tokio", "serde"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["trace", "cors"] }
# SECURITY: default-features off => rustls only; never native-tls/OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum-server = { version = "0.6", features = ["tls-rustls"] }

# Storage
redb = "2.1"

# Types (local crates)
sxiaum-types = { path = "crates/types" }
sxiaum-crypto = { path = "crates/crypto" }
sxiaum-block = { path = "crates/block" }
sxiaum-networking = { path = "crates/networking" }
sxiaum-mempool = { path = "crates/mempool" }
sxiaum-consensus = { path = "crates/consensus" }
sxiaum-execution = { path = "crates/execution" }
sxiaum-state = { path = "crates/state" }
sxiaum-storage = { path = "crates/storage" }
sxiaum-zk = { path = "crates/zk" }
sxiaum-light-client = { path = "crates/light-client" }
sxiaum-node = { path = "crates/node" }
sxiaum-rpc = { path = "crates/rpc" }
sxiaum-keystore = { path = "crates/keystore" }
sxiaum-keytool = { path = "crates/keytool" }
sxiaum-nano = { path = "crates/nano" }
# Parallel computing
rayon = "1.8"

[profile.dev]
codegen-units = 1

[profile.dev.build-override]
codegen-units = 1

[profile.test]
opt-level = 2
codegen-units = 1

[profile.test.build-override]
codegen-units = 1

[profile.release]
debug = false
lto = "fat"
codegen-units = 1
strip = "symbols"

# Use `cargo build --profile release-perf` for flamegraph / perf profiling.
[profile.release-perf]
inherits = "release"
debug = true
strip = false

[profile.bench]
debug = true
lto = "fat"
codegen-units = 1

