[package]
name = "sxiaum-zk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
ark-ff = { workspace = true }
ark-ec = { workspace = true }
ark-groth16 = { workspace = true }
ark-relations = { workspace = true }
ark-r1cs-std = { workspace = true }
ark-mnt4-753 = { workspace = true }
ark-mnt6-753 = { workspace = true }
ark-crypto-primitives = { workspace = true }
ark-serialize = { workspace = true }
ark-bls12-381 = { workspace = true }
ark-std = { workspace = true }
ark-snark = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
ed25519-dalek = { workspace = true }
primitive-types = { workspace = true }
sxiaum-types = { workspace = true }
sxiaum-execution = { workspace = true }
sxiaum-state = { workspace = true }
sxiaum-block = { workspace = true }
sxiaum-storage = { workspace = true }
sp1-sdk = { version = "3", optional = true }
sxiaum-crypto = { workspace = true }

[features]
default = ["groth16"]
groth16 = []
sp1-sdk = ["dep:sp1-sdk"]
dev-simulated-proofs = []

[dev-dependencies]
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "fold_benchmarks"
harness = false
