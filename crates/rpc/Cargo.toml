[package]
name = "sxiaum-rpc"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sxiaum-types = { workspace = true }
sxiaum-block = { workspace = true }
sxiaum-storage = { workspace = true }
sxiaum-mempool = { workspace = true }
sxiaum-consensus = { workspace = true }
sxiaum-networking = { workspace = true }
sxiaum-state = { workspace = true }
sxiaum-execution = { workspace = true }
sxiaum-crypto = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
metrics = { workspace = true }
hex = { workspace = true }
primitive-types = { workspace = true }
chrono = { workspace = true }
governor = "0.6"
# Manual rendering via /metrics; no exporter HTTP listener is spawned, so the
# heavy `http-listener` feature (hyper server stack) is not enabled.
metrics-exporter-prometheus = { version = "0.13", default-features = false, features = [] }
zeroize = { workspace = true }
sha3 = { workspace = true }

axum = { version = "0.7", features = ["ws"] }
# 0.8 drops unmaintained rustls-pemfile in favour of rustls-pki-types
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
thiserror = { workspace = true }
jsonwebtoken = "9.3"
futures = { workspace = true }
subtle = "2.6"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.4", features = ["util"] }
libp2p = { workspace = true }
