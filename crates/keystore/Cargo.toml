[package]
name = "sxiaum-keystore"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
sxiaum-types = { workspace = true }
sxiaum-crypto = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "io-util"] }
async-trait = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls"] }
base64 = "0.22"
aes-gcm = "0.10"
aes = "0.8"
ctr = "0.9"
pbkdf2 = "0.12"
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
hmac = "0.12"
argon2 = "0.5"
zeroize = { workspace = true }
thiserror = { workspace = true }
sha3 = { workspace = true }
tracing = { workspace = true }
subtle = "2.6"
ark-bls12-381 = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }

[features]
default = ["fs"]
# Filesystem-backed keystore adapter (FsKeyStore).
fs = []
# HashiCorp Vault-backed keystore adapter (VaultKeyStore).
vault = []

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
