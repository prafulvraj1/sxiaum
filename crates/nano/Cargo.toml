[package]
name = "sxiaum-nano"
version = "0.1.0"
edition = "2021"
description = "Zero-disk hyper-stateless nano-node and light client for SXIAUM L1"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = [
    "serde/std",
    "serde_json/std",
    "ark-std/std",
    "ark-ff/std",
    "ark-ec/std",
    "ark-bls12-381/std",
]
wasm = []
ffi = []

[dependencies]
sxiaum-types = { workspace = true }
sxiaum-crypto = { workspace = true }
sxiaum-block = { workspace = true }
sxiaum-state = { workspace = true }
sxiaum-storage = { workspace = true }
sxiaum-consensus = { workspace = true }

ark-bls12-381 = { workspace = true }
ark-ec = { workspace = true }
ark-ff = { workspace = true }
ark-serialize = { workspace = true }
ark-std = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
primitive-types = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
ed25519-dalek = { workspace = true }

